<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - বাজার দর</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">লগইন করুন</h2>
        
        <!-- Sign In Form -->
        <form id="signin-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল</label>
                <input type="email5" id="signin-email" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-green-600" placeholder="আপনার ইমেইল দিন">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="signin-password" required class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-green-600" placeholder="পাসওয়ার্ড দিন">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-semibold hover:bg-green-700 transition">লগইন</button>
        </form>

        <!-- Social Login Option -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500 mb-3">অথবা সোশ্যাল মিডিয়া দিয়ে প্রবেশ করুন</p>
            <button id="google-login-btn" class="w-full border border-gray-200 py-2.5 rounded-xl font-medium text-gray-700 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <span class="font-bold">G</span> Google দিয়ে লগইন
            </button>
        </div>

        <!-- Register Link -->
        <p class="text-sm text-center text-gray-500 mt-6">
            একাউন্ট নেই? <a href="signup.html" class="text-green-600 font-semibold hover:underline">রেজিস্ট্রেশন করুন</a>
        </p>
    </div>

</body>
</html>
